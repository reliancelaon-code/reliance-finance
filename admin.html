<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Reliance Finance</title>

    <link rel="stylesheet" href="style.css">

    <!-- Excel Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="admin-login" id="adminLogin">

    <div class="admin-login-box">

        <div class="admin-logo">R</div>

        <h1>Admin Login</h1>
        <p>Reliance Finance Administration</p>

        <form id="loginForm">

            <label>Username</label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p class="login-error" id="loginError"></p>

        </form>

    </div>

</div>


<div class="admin-dashboard" id="adminDashboard">

    <header class="admin-header">

        <div>
            <h2>RELIANCE FINANCE</h2>
            <span>Admin Panel</span>
        </div>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main class="admin-main">

        <div class="admin-title">

            <div>
                <h1>Applications</h1>
                <p>Manage submitted loan applications.</p>
            </div>

            <button
                class="download-btn"
                id="downloadBtn"
            >
                Download Excel
            </button>

        </div>


        <div class="admin-stats">

            <div class="admin-stat-card">
                <span>Total Applications</span>
                <strong id="totalApplications">0</strong>
            </div>

            <div class="admin-stat-card">
                <span>Personal Loans</span>
                <strong id="personalCount">0</strong>
            </div>

            <div class="admin-stat-card">
                <span>Home Loans</span>
                <strong id="homeCount">0</strong>
            </div>

            <div class="admin-stat-card">
                <span>Business Loans</span>
                <strong id="businessCount">0</strong>
            </div>

        </div>


        <div class="applications-box">

            <div class="admin-filters">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name, mobile, Gmail, loan type..."
                >

            </div>


            <div class="table-heading">

                <h2>Loan Applications</h2>

                <button id="refreshBtn">
                    ↻ Refresh
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Loan Type</th>
                            <th>Amount</th>
                            <th>State</th>
                            <th>Income</th>
                        </tr>

                    </thead>

                    <tbody id="applicationsTable">

                        <tr>
                            <td colspan="9">
                                Loading applications...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

const adminLogin =
    document.getElementById("adminLogin");

const adminDashboard =
    document.getElementById("adminDashboard");

const loginForm =
    document.getElementById("loginForm");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const applicationsTable =
    document.getElementById("applicationsTable");

const totalApplications =
    document.getElementById("totalApplications");

const personalCount =
    document.getElementById("personalCount");

const homeCount =
    document.getElementById("homeCount");

const businessCount =
    document.getElementById("businessCount");

const refreshBtn =
    document.getElementById("refreshBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const searchInput =
    document.getElementById("searchInput");


let allApplications = [];


/* LOGIN */

loginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("adminUsername").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    if (
        username === "admin" &&
        password === "admin123"
    ) {

        adminLogin.style.display = "none";
        adminDashboard.style.display = "block";
        loginError.textContent = "";

        loadApplications();

    } else {

        loginError.textContent =
            "Invalid username or password.";

    }

});


/* LOGOUT */

logoutBtn.addEventListener("click", function() {

    adminDashboard.style.display = "none";
    adminLogin.style.display = "flex";

    document.getElementById("adminPassword").value = "";

});


/* LOAD APPLICATIONS */

async function loadApplications() {

    applicationsTable.innerHTML = `
        <tr>
            <td colspan="9">
                Loading applications...
            </td>
        </tr>
    `;

    try {

        const response =
            await fetch("/applications");

        if (!response.ok) {
            throw new Error("Applications load failed");
        }

        const applications =
            await response.json();

        allApplications =
            Array.isArray(applications)
                ? applications
                : [];


        totalApplications.textContent =
            allApplications.length;


        personalCount.textContent =
            allApplications.filter(function(app) {

                return String(app.loanType || "")
                    .toLowerCase()
                    .includes("personal");

            }).length;


        homeCount.textContent =
            allApplications.filter(function(app) {

                return String(app.loanType || "")
                    .toLowerCase()
                    .includes("home");

            }).length;


        businessCount.textContent =
            allApplications.filter(function(app) {

                return String(app.loanType || "")
                    .toLowerCase()
                    .includes("business");

            }).length;


        renderApplications(allApplications);

    } catch (error) {

        console.error(error);

        applicationsTable.innerHTML = `
            <tr>
                <td colspan="9">
                    Applications load nahi hui.
                </td>
            </tr>
        `;

    }

}


/* SHOW APPLICATIONS */

function renderApplications(applications) {

    if (
        !Array.isArray(applications) ||
        applications.length === 0
    ) {

        applicationsTable.innerHTML = `
            <tr>
                <td colspan="9">
                    No applications found.
                </td>
            </tr>
        `;

        return;
    }


    applicationsTable.innerHTML =
        applications.map(function(app) {

            const date =
                app.date
                    ? new Date(app.date).toLocaleString()
                    : "-";


            return `
                <tr>

                    <td>${app.id || "-"}</td>

                    <td>${date}</td>

                    <td>${app.name || "-"}</td>

                    <td>${app.mobile || "-"}</td>

                    <td>${app.email || "-"}</td>

                    <td>${app.loanType || "-"}</td>

                    <td>₹${app.loanAmount || "-"}</td>

                    <td>${app.state || "-"}</td>

                    <td>₹${app.monthlyIncome || "-"}</td>

                </tr>
            `;

        }).join("");

}


/* SEARCH */

searchInput.addEventListener("input", function() {

    const searchText =
        searchInput.value
            .toLowerCase()
            .trim()
            .replace(/\s+/g, "");


    if (searchText === "") {

        renderApplications(allApplications);
        return;

    }


    const filteredApplications =
        allApplications.filter(function(app) {

            const searchableData = [

                app.id,
                app.name,
                app.mobile,
                app.email,
                app.loanType,
                app.loanAmount,
                app.state,
                app.monthlyIncome

            ]
            .map(function(value) {

                return String(value || "")
                    .toLowerCase()
                    .replace(/\s+/g, "");

            })
            .join(" ");


            return searchableData.includes(searchText);

        });


    renderApplications(filteredApplications);

});


/* REFRESH */

refreshBtn.addEventListener("click", function() {

    searchInput.value = "";

    loadApplications();

});


/* DOWNLOAD EXCEL - MOBILE FRIENDLY */

downloadBtn.addEventListener("click", async function() {

    try {

        if (typeof XLSX === "undefined") {

            alert(
                "Excel system load nahi hua. Internet check karein."
            );

            return;

        }


        downloadBtn.disabled = true;
        downloadBtn.textContent = "Preparing...";


        const response =
            await fetch("/applications");


        if (!response.ok) {

            throw new Error(
                "Applications load failed"
            );

        }


        const applications =
            await response.json();


        if (
            !Array.isArray(applications) ||
            applications.length === 0
        ) {

            alert(
                "Download karne ke liye koi application nahi hai."
            );

            return;

        }


        const excelData =
            applications.map(function(app) {

                return {

                    "ID":
                        app.id || "",

                    "Date":
                        app.date
                            ? new Date(app.date).toLocaleString()
                            : "",

                    "Name":
                        app.name || "",

                    "Mobile":
                        app.mobile || "",

                    "Email":
                        app.email || "",

                    "Loan Type":
                        app.loanType || "",

                    "Loan Amount":
                        app.loanAmount || "",

                    "State":
                        app.state || "",

                    "Monthly Income":
                        app.monthlyIncome || ""

                };

            });


        const worksheet =
            XLSX.utils.json_to_sheet(excelData);


        worksheet["!cols"] = [

            { wch: 12 },
            { wch: 22 },
            { wch: 22 },
            { wch: 16 },
            { wch: 30 },
            { wch: 18 },
            { wch: 18 },
            { wch: 18 },
            { wch: 20 }

        ];


        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Applications"
        );


        /*
           Generate XLSX as ArrayBuffer
           This works better on mobile browsers.
        */

        const excelBuffer =
            XLSX.write(
                workbook,
                {
                    bookType: "xlsx",
                    type: "array"
                }
            );


        const blob =
            new Blob(
                [excelBuffer],
                {
                    type:
                        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "Reliance-Finance-Applications.xlsx";

        link.style.display = "none";


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        setTimeout(function() {

            URL.revokeObjectURL(url);

        }, 1000);


    } catch (error) {

        console.error(error);

        alert(
            "Excel download nahi ho saka."
        );

    } finally {

        downloadBtn.disabled = false;

        downloadBtn.textContent =
            "Download Excel";

    }

});


</script>

</body>
</html>
